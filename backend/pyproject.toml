[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "componentes_py"
version = "0.0.1"
description = "Backend dos componentes reutilizáveis (Lookup) para projetos FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src/componentes_py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
