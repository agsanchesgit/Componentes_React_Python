[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "componentes_py"
version = "0.0.2"
description = "Backend dos componentes reutilizáveis (Lookup) para projetos FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
]

[project.optional-dependencies]
# Drivers de banco (o consumidor instala só o que usa; a biblioteca não importa nenhum deles).
oracle = ["oracledb>=2"]
sqlserver = ["pyodbc>=5"]
postgresql = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src/componentes_py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# O Depends() nos defaults é o idioma do FastAPI.
extend-immutable-calls = ["fastapi.Depends"]
